[package]
name = "bxm-canon"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "BXM Canon: a binary encoding with exactly one valid encoding for every value"
repository = "https://github.com/softdevstudio/bxm"
homepage = "https://bxm.net"
readme = "../README.md"

[lib]
name = "bxm_canon"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "bxm-canon"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
