name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh

  canon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: canon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
        env:
          BXM_PROP_ITERS: "300000"
      - run: tests/c/run.sh
      - run: cargo run -q --release --example stats -- 300000

  memo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: memo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: memo/go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 -race ./...

  js:
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: scripts/build-js.sh --pack
      - name: Install the packed package and use it
        run: |
          set -eux
          mkdir -p /tmp/use && cd /tmp/use && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/dist/bxm-canon-js.tgz"
          node --input-type=module -e "import {load} from 'bxm-canon'; const c = await load(); if (c.hashText('{\"b\":1,\"a\":2}') !== 'e70e7c7b89c3a8b38fe00713290413936c9f976266c102b35aa91556dcc5233a') process.exit(1); console.log('esm ok', c.version)"
          node -e "require('bxm-canon').load().then(c => { if (!c.isCanonical(c.fromText('[1]'))) process.exit(1); console.log('cjs ok') })"

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        working-directory: python
        run: cargo fmt --check && cargo clippy -- -D warnings
      - run: scripts/build-python.sh
        env:
          PYTHON: python
